[project]
name = "sentinel-edge"
version = "0.1.0"
description = "Sentinel Edge — on-premises CV pipeline: RTSP -> motion gate -> detect -> track -> rules -> clip -> publish. Raw video never leaves the site."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "websockets>=12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Accelerator runtimes are installed system-side on target devices; these extras
# pull only the pip-installable parts so the base image stays small.
onnx = ["onnxruntime>=1.17", "opencv-python-headless>=4.9"]
rtsp = ["av>=12"]
lpr = ["fast-plate-ocr>=0.2"]
metrics = ["psutil>=5.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sentinel-edge = "sentinel_edge.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
